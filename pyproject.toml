[build-system]
requires = ["scikit-build-core>=0.10", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nfdrs4"
dynamic = ["version"]
description = "Python bindings for the US National Fire Danger Rating System version 4 (NFDRS4)"
readme = "python/README.md"
requires-python = ">=3.9"
license = { text = "Public Domain" }
authors = [{ name = "USDA Forest Service, Missoula Fire Sciences Laboratory" }]
keywords = ["fire danger", "NFDRS", "fuel moisture", "wildland fire"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/firelab/NFDRS4"
Documentation = "https://doi.org/10.1016/j.envsoft.2024.106181"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
# Build only the Python extension (python/CMakeLists.txt). The top-level
# CMakeLists.txt also builds the CLI, which needs config4cpp and isn't
# required for the bindings.
cmake.source-dir = "python"
cmake.build-type = "Release"
wheel.packages = ["python/nfdrs4"]
install.components = ["python"]
sdist.include = ["/lib/", "/swig/nfdrs4.i", "/python/", "/CMakeLists.txt"]
sdist.exclude = ["__pycache__/", "*.pyc", ".git*", "docs/", ".readthedocs.yaml", "app/", "extern/", "data/", "doc/", "swig/nfdrs4_wrap.cxx", "swig/nfdrs4.py"]

[tool.scikit-build.metadata.version]
# Single source of truth: the VERSION in the top-level CMakeLists.txt
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\s*\([^)]*?VERSION\s+(?P<value>[0-9][0-9.]*)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]
